<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcação de consultas · Protótipo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <strong>Controles da demonstração</strong>
        <span>Protótipo · UBS de Maragogi · dados fictícios</span>
      </div>
    </div>
    <div class="scenario">
      <label class="field-inline">UBS do gestor
        <select id="ubsSelect"></select>
      </label>
      <div class="clock" role="group" aria-label="Relógio simulado">
        <span class="clock-label" id="clockLabel"></span>
        <button type="button" class="btn small" data-clock="1h">+1 h</button>
        <button type="button" class="btn small" data-clock="18h">Ir para 18h</button>
        <button type="button" class="btn small" data-clock="dia">Próximo dia</button>
      </div>
      <button type="button" class="btn ghost small" id="resetBtn">Reiniciar demo</button>
    </div>
  </header>

  <main class="stage">
    <section class="phone-col" aria-label="WhatsApp simulado">
      <div class="contacts" id="contacts"></div>
      <div class="phone">
        <div class="phone-status"><span id="phoneTime"></span><span class="phone-icons" aria-hidden="true">▮▮▮ ◔</span></div>
        <div class="chat-header">
          <span class="chat-avatar" aria-hidden="true">+</span>
          <div>
            <strong>Marcação de consultas</strong>
            <span>UBS de Maragogi · atendimento automático</span>
          </div>
        </div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <form class="composer" id="composer" autocomplete="off">
          <input id="msgInput" type="text" placeholder="Digite uma mensagem" aria-label="Mensagem">
          <button type="submit" class="send" aria-label="Enviar">➤</button>
        </form>
      </div>
      <p class="phone-caption" id="phoneCaption"></p>
    </section>

    <section class="app" aria-label="Painel do Gestor da UBS">
      <aside class="sidebar">
        <div class="side-brand"><span class="brand-mark" aria-hidden="true"></span><div><strong>Painel do Gestor</strong><span id="sideUbs">UBS Centro</span></div></div>
        <nav class="nav" id="tabs" role="tablist">
          <button type="button" role="tab" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Visão geral</button>
          <button type="button" role="tab" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Agenda</button>
          <button type="button" role="tab" data-tab="imprevisto"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>Imprevistos</button>
          <button type="button" role="tab" data-tab="balcao"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Marcar no balcão</button>
          <button type="button" role="tab" data-tab="vagas"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Vagas e equipe</button>
          <button type="button" role="tab" data-tab="historico"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5M12 8v5l3 2"/></svg>Histórico de avisos<span class="count" id="navCount" hidden></span></button>
        </nav>
        <div class="side-foot">Protótipo · dados fictícios</div>
      </aside>
      <div class="app-main">
        <header class="app-header">
          <div><h1 id="panelTitle">Visão geral</h1><p id="panelSub"></p></div>
          <div class="app-user"><span class="avatar">GU</span><div><strong>Gestor(a) da UBS</strong><span id="userUbs">UBS Centro</span></div></div>
        </header>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
